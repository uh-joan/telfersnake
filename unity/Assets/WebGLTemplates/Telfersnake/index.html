<!DOCTYPE html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3f8a34">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      @font-face { font-family: Fredoka; src: url("TemplateData/Fredoka-Bold.ttf"); font-weight: 700; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; touch-action: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

      /* The loading screen: a sunny morning over Telferscot Road while the snake fills up. */
      #loader {
        position: fixed; inset: 0; overflow: hidden; z-index: 2;
        font-family: Fredoka, ui-rounded, system-ui, sans-serif; color: #fff;
        background: linear-gradient(#5fb8f5 0%, #9fd8ff 55%, #dff3ff 100%);
        transition: opacity .7s ease, transform .7s ease;
      }
      #loader.gone { opacity: 0; transform: scale(1.06); pointer-events: none; }
      #sun { position: absolute; top: -70px; right: -70px; width: 300px; height: 300px; }
      #sun .rays { transform-origin: 150px 150px; animation: spin 40s linear infinite; }
      .cloud { position: absolute; left: 0; opacity: .95; animation: drift linear infinite; }
      .cloud.c1 { top: 9%; width: 190px; animation-duration: 55s; animation-delay: -12s; }
      .cloud.c2 { top: 22%; width: 120px; animation-duration: 75s; animation-delay: -48s; opacity: .8; }
      .cloud.c3 { top: 4%; width: 140px; animation-duration: 65s; animation-delay: -30s; opacity: .7; }
      #land { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 46%; display: block; }
      #land .tree { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      #land .tree:nth-of-type(2n) { animation-delay: -2s; }

      #middle {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 30px; padding: 0 16px 14vh; box-sizing: border-box;
      }
      #logo { font-size: min(15vw, 124px); font-weight: 700; letter-spacing: -.02em; white-space: nowrap;
        text-shadow: 0 7px 0 rgba(20,40,70,.35), 0 0 34px rgba(255,255,255,.5); animation: bob 2.4s ease-in-out infinite; }
      #logo b { color: #7ddc5c; font-weight: 700; text-shadow: 0 7px 0 rgba(10,60,20,.55); }
      #logo sup { font-size: .28em; vertical-align: super; background: #ffd43b; color: #222638; border-radius: .5em;
        padding: .1em .45em; margin-left: .2em; display: inline-block; transform: rotate(-8deg); text-shadow: 0 3px 0 rgba(0,0,0,.2); }

      /* The bar is a snake: its body grows with the download, eating the snacks on its way. */
      #bar { position: relative; width: min(80vw, 560px); height: 46px; border-radius: 23px; background: rgba(30,70,40,.28);
        padding: 7px; box-sizing: border-box; box-shadow: inset 0 3px 8px rgba(0,0,0,.25), 0 2px 0 rgba(255,255,255,.45); }
      #fill { position: relative; height: 100%; width: 4%; min-width: 30px; border-radius: 16px; transition: width .35s ease;
        background: repeating-linear-gradient(90deg, #4cbb4a 0 20px, #f2d94a 20px 28px);
        box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), inset 0 3px 0 rgba(255,255,255,.35); animation: slither .6s linear infinite; }
      #head { position: absolute; right: -22px; top: 50%; width: 50px; height: 42px; margin-top: -21px; border-radius: 50% 60% 60% 50%;
        background: #4cbb4a; box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.25); }
      #head i { position: absolute; top: 7px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
      #head i::after { content: ""; position: absolute; left: 5px; top: 3px; width: 7px; height: 7px; border-radius: 50%; background: #222638; }
      #head i:first-child { left: 18px; } #head i:last-child { left: 32px; }
      #head u { position: absolute; right: -15px; top: 22px; width: 16px; height: 4px; background: #e5484d; border-radius: 2px;
        transform-origin: 0 50%; animation: tongue 1.6s ease-in-out infinite; }
      #head u::after { content: ""; position: absolute; right: -3px; top: -2px; border: 3px solid transparent; border-left-color: #e5484d; }
      .snack { position: absolute; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; transition: transform .25s ease, opacity .25s ease; }
      .snack.eaten { transform: scale(1.8); opacity: 0; }
      #hint { font-size: 21px; text-shadow: 0 2px 0 rgba(20,40,70,.35); }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(calc(100vw + 60px)); } }
      @keyframes sway { 50% { transform: rotate(2.5deg); } }
      @keyframes bob { 50% { transform: translateY(-9px) rotate(-1deg); } }
      @keyframes slither { to { background-position: 28px 0; } }
      @keyframes tongue { 0%, 70%, 100% { transform: scaleX(0); } 78%, 92% { transform: scaleX(1); } 85% { transform: scaleX(.6) rotate(8deg); } }
      /* Upright phones: a shorter strip of land, so the street and the school still fit across. */
      @media (max-aspect-ratio: 3/4) { #land { height: 30%; } #middle { padding-bottom: 8vh; } }
      @media (prefers-reduced-motion: reduce) { #loader *, #loader *::after { animation: none !important; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <svg id="sun" viewBox="0 0 300 300" aria-hidden="true">
        <g class="rays" fill="#ffe58a" opacity=".55">
          <path d="M150 150 L140 0 L160 0 Z"/><path d="M150 150 L140 0 L160 0 Z" transform="rotate(30 150 150)"/>
          <path d="M150 150 L140 0 L160 0 Z" transform="rotate(60 150 150)"/><path d="M150 150 L140 0 L160 0 Z" transform="rotate(90 150 150)"/>
          <path d="M150 150 L140 0 L160 0 Z" transform="rotate(120 150 150)"/><path d="M150 150 L140 0 L160 0 Z" transform="rotate(150 150 150)"/>
          <path d="M150 150 L140 0 L160 0 Z" transform="rotate(180 150 150)"/><path d="M150 150 L140 0 L160 0 Z" transform="rotate(210 150 150)"/>
          <path d="M150 150 L140 0 L160 0 Z" transform="rotate(240 150 150)"/><path d="M150 150 L140 0 L160 0 Z" transform="rotate(270 150 150)"/>
          <path d="M150 150 L140 0 L160 0 Z" transform="rotate(300 150 150)"/><path d="M150 150 L140 0 L160 0 Z" transform="rotate(330 150 150)"/>
        </g>
        <circle cx="150" cy="150" r="72" fill="#ffd43b"/><circle cx="150" cy="150" r="60" fill="#ffe066"/>
      </svg>
      <svg class="cloud c1" viewBox="0 0 190 80" aria-hidden="true"><g fill="#fff"><circle cx="50" cy="50" r="28"/><circle cx="90" cy="36" r="34"/><circle cx="135" cy="50" r="26"/><rect x="40" y="48" width="110" height="30" rx="15"/></g></svg>
      <svg class="cloud c2" viewBox="0 0 190 80" aria-hidden="true"><g fill="#fff"><circle cx="50" cy="50" r="28"/><circle cx="90" cy="36" r="34"/><circle cx="135" cy="50" r="26"/><rect x="40" y="48" width="110" height="30" rx="15"/></g></svg>
      <svg class="cloud c3" viewBox="0 0 190 80" aria-hidden="true"><g fill="#fff"><circle cx="50" cy="50" r="28"/><circle cx="90" cy="36" r="34"/><circle cx="135" cy="50" r="26"/><rect x="40" y="48" width="110" height="30" rx="15"/></g></svg>

      <!-- Telferscot Road: the terraces, the school, the trees of the Common, the meadow in front. -->
      <svg id="land" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <path d="M0 210 C 220 150, 420 150, 640 190 S 1100 230, 1300 175 S 1520 150, 1600 165 L1600 420 L0 420 Z" fill="#8fd17a"/>
        <g transform="translate(440 150)">
          <g fill="#c96f4a"><rect x="0" y="40" width="70" height="70"/><rect x="72" y="40" width="70" height="70" fill="#d98a5f"/><rect x="144" y="40" width="70" height="70"/><rect x="216" y="40" width="70" height="70" fill="#d98a5f"/><rect x="288" y="40" width="70" height="70"/></g>
          <path d="M-6 42 L35 8 L77 42 L113 8 L149 42 L185 8 L221 42 L257 8 L293 42 L329 8 L364 42 Z" fill="#6b4a3e"/>
          <g fill="#fff6d8"><rect x="14" y="58" width="16" height="18" rx="2"/><rect x="40" y="58" width="16" height="18" rx="2"/><rect x="86" y="58" width="16" height="18" rx="2"/><rect x="112" y="58" width="16" height="18" rx="2"/><rect x="158" y="58" width="16" height="18" rx="2"/><rect x="184" y="58" width="16" height="18" rx="2"/><rect x="230" y="58" width="16" height="18" rx="2"/><rect x="256" y="58" width="16" height="18" rx="2"/><rect x="302" y="58" width="16" height="18" rx="2"/><rect x="328" y="58" width="16" height="18" rx="2"/></g>
          <g fill="#3d6fb6"><rect x="27" y="86" width="14" height="24" rx="2"/><rect x="99" y="86" width="14" height="24" rx="2" fill="#e5484d"/><rect x="171" y="86" width="14" height="24" rx="2" fill="#2f9e6e"/><rect x="243" y="86" width="14" height="24" rx="2" fill="#ffd43b"/><rect x="315" y="86" width="14" height="24" rx="2"/></g>
          <g fill="#8a6a5c"><rect x="30" y="0" width="10" height="20"/><rect x="174" y="0" width="10" height="20"/><rect x="318" y="0" width="10" height="20"/></g>
        </g>
        <g transform="translate(860 118)">
          <rect x="0" y="40" width="300" height="100" fill="#b5523b"/><path d="M-10 42 L150 0 L310 42 Z" fill="#7a3f33"/>
          <rect x="125" y="14" width="50" height="22" rx="4" fill="#ffd43b"/><circle cx="150" cy="25" r="7" fill="#fff"/>
          <g fill="#fff6d8"><rect x="20" y="62" width="34" height="26" rx="3"/><rect x="72" y="62" width="34" height="26" rx="3"/><rect x="194" y="62" width="34" height="26" rx="3"/><rect x="246" y="62" width="34" height="26" rx="3"/></g>
          <rect x="128" y="92" width="44" height="48" rx="4" fill="#3d6fb6"/>
        </g>
        <g fill="#5a3b2b">
          <rect x="214" y="170" width="12" height="44"/><rect x="345" y="176" width="10" height="40"/><rect x="1230" y="168" width="12" height="44"/><rect x="1430" y="160" width="12" height="44"/>
        </g>
        <g fill="#4aa83c">
          <circle class="tree" cx="220" cy="150" r="38"/><circle class="tree" cx="350" cy="160" r="30"/><circle class="tree" cx="1236" cy="146" r="40"/><circle class="tree" cx="1436" cy="138" r="40"/>
        </g>
        <path d="M0 290 C 260 240, 520 250, 800 280 S 1340 300, 1600 250 L1600 420 L0 420 Z" fill="#5cb84a"/>
        <path d="M0 360 C 320 320, 700 340, 1000 360 S 1450 350, 1600 330 L1600 420 L0 420 Z" fill="#43a03a"/>
        <g fill="#fff"><circle cx="160" cy="330" r="5"/><circle cx="420" cy="300" r="4"/><circle cx="1180" cy="320" r="5"/><circle cx="1500" cy="300" r="4"/></g>
        <g fill="#ffd43b"><circle cx="160" cy="330" r="2"/><circle cx="420" cy="300" r="1.6"/><circle cx="1180" cy="320" r="2"/><circle cx="1500" cy="300" r="1.6"/></g>
        <g fill="#ff8fab"><circle cx="300" cy="380" r="5"/><circle cx="980" cy="390" r="5"/><circle cx="1320" cy="372" r="4"/></g>
      </svg>

      <div id="middle">
        <div id="logo">Telfer<b>snake</b><sup>HD</sup></div>
        <div id="bar">
          <svg class="snack" style="left:28%" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="11" r="8" fill="#e5484d"/><path d="M10 4 Q12 0 15 2" stroke="#2f9e6e" stroke-width="2.5" fill="none"/></svg>
          <svg class="snack" style="left:52%" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="#d9a066"/><g fill="#5a3b2b"><circle cx="7" cy="7" r="1.6"/><circle cx="13" cy="9" r="1.6"/><circle cx="9" cy="13" r="1.6"/></g></svg>
          <svg class="snack" style="left:74%" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 18 L4 6 Q10 1 16 6 Z" fill="#ff922b"/><path d="M8 4 L10 0 L12 4" stroke="#2f9e6e" stroke-width="2.5" fill="none"/></svg>
          <svg class="snack" style="left:93%" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="12" r="5" fill="#7048e8"/><circle cx="13" cy="12" r="5" fill="#7048e8"/><circle cx="10" cy="7" r="5" fill="#845ef7"/></svg>
          <div id="fill"><div id="head"><i></i><i></i><u></u></div></div>
        </div>
        <div id="hint">Getting ready…</div>
      </div>
    </div>
    <!-- The build's settings, as data: the site's CSP allows no inline script, so boot.js reads them. -->
    <script type="application/json" id="unity-config">
      {
#if PROGRESSIVE_ASSET_LOADING
        "primaryDataUrls": {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        "secondaryDataUrls": {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        "dataUrl": "Build/{{{ DATA_FILENAME }}}",
#endif
        "frameworkUrl": "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        "codeUrl": "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        "symbolsUrl": "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        "streamingAssetsUrl": "StreamingAssets",
        "companyName": {{{ JSON.stringify(COMPANY_NAME) }}},
        "productName": {{{ JSON.stringify(PRODUCT_NAME) }}},
        "productVersion": {{{ JSON.stringify(PRODUCT_VERSION) }}}
      }
    </script>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script src="TemplateData/boot.js"></script>
  </body>
</html>
